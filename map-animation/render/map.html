<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css" />
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; width: 100%; height: 100%; }
  #stage { position: relative; width: 100%; height: 100%; }
  #map { position: absolute; inset: 0; }
  .ms-pane { position: absolute; top: 0; bottom: 0; overflow: hidden; }
  .ms-overlay { position: absolute; inset: 0; pointer-events: none; font-family: "Segoe UI", Arial, sans-serif; }
  .ms-label {
    position: absolute; transform: translate(-50%, -100%);
    color: #f5f5f5; font-size: 15px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.9);
    white-space: nowrap; opacity: 0; transition: none;
  }
  .ms-label-region {
    transform: translate(-50%, -50%); white-space: pre; text-align: center; line-height: 1.15; font-size: 26px; font-weight: 700; letter-spacing: .03em; color: #fff;
    text-shadow: 0 0 6px rgba(0,0,0,.95), 0 2px 8px rgba(0,0,0,.9), 0 0 2px #000;
  }
  .ms-legend {
    position: absolute; left: 32px; bottom: 32px; padding: 12px 16px; border-radius: 6px;
    background: rgba(10,10,14,.72); color: #eee; font-size: 13px; opacity: 0;
  }
  .ms-legend .ramp { display: flex; height: 10px; margin: 6px 0; border-radius: 3px; overflow: hidden; }
  .ms-legend .ramp span { flex: 1; }
  .ms-date-counter {
    position: absolute; top: 28px; right: 36px; color: #f5f5f5; font-size: 34px; font-weight: 700;
    text-shadow: 0 1px 4px rgba(0,0,0,.85); opacity: 0;
  }
  .ms-title {
    position: absolute; top: 28px; left: 36px; color: #f5f5f5; font-size: 22px; font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,.85); opacity: 0;
  }
  .ms-attribution {
    position: absolute; bottom: 8px; right: 12px; color: rgba(255,255,255,.55); font-size: 10px;
  }
  .ms-editorial-note {
    position: absolute; left: 12px; bottom: 8px; right: 12px; max-width: 62%;
    color: rgba(255,255,255,.75); font-size: 10px; line-height: 1.4;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="./map-runtime.js"></script>
</body>
</html>
